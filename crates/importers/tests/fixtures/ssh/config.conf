# Synthetic OpenSSH client configuration for tests. Every host name is invented.

Host *
    ServerAliveInterval 60
    User ops-default

Host bastion
    HostName bastion.example.org
    User alice
    Port 22
    IdentityFile ~/.ssh/id_example

Host db01
    HostName db01.example.org
    User alice
    ProxyJump bastion

HOST web01
    hostname 10.0.0.5
    port = 2222
    user "web admin"

Host app01 app02
    HostName "app.example.org"
    ProxyJump ops@bastion:2200

Host edge
    Hostname edge.example.org
    ProxyJump "edge-gw", other

Host gw-one
    HostName gw1.example.org
    ProxyJump gw-two

Host gw-two
    HostName gw2.example.org
    ProxyJump gw-one

Include conf.d/*.conf

Match host *.internal
    User ignored-match-user

Host *.lab
    HostName ignored.example.org
