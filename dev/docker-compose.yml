# Local test servers for Portolano. Everything is bound to 127.0.0.1 only.
#
#   sshd   127.0.0.1:12222   user "tester": password or key
#   xrdp   127.0.0.1:13389   user "tester": password (TLS, no NLA)
#   vnc    127.0.0.1:15900   VNC authentication (password only, no user name)
#   vnc-tls 127.0.0.1:15901  VeNCrypt (TLS + self-signed certificate): X509Vnc (password) and
#                            X509Plain (user "tester", same password); new certificate at every start
#
# Usage:
#   bash dev/servers.sh up       generate test credentials (first time), build and start
#   bash dev/servers.sh down     stop and remove the containers
#   (equivalent root scripts: pnpm dev:servers:up / pnpm dev:servers:down)
#
# Test credentials are generated by dev/servers.sh into dev/keys/ (git-ignored):
#   dev/keys/id_ed25519(.pub)  SSH key for user "tester" (authorized_keys is derived from it)
#   dev/keys/test.env          TEST_PASSWORD (sshd and xrdp) and VNC_PASSWORD (8 chars)
# They are throwaway values for these local containers only. Never commit dev/keys/.
#
# Validate without starting anything:  docker compose -f dev/docker-compose.yml config

name: portolano-dev

x-test-credentials: &test-credentials
  env_file:
    - path: ./keys/test.env
      required: false

services:
  sshd:
    <<: *test-credentials
    build: ./sshd
    container_name: portolano-dev-sshd
    ports:
      - "127.0.0.1:12222:22"
    volumes:
      - ./keys/authorized_keys:/keys/authorized_keys:ro

  xrdp:
    <<: *test-credentials
    build: ./xrdp
    container_name: portolano-dev-xrdp
    ports:
      - "127.0.0.1:13389:3389"
    shm_size: "512m"

  vnc:
    <<: *test-credentials
    build: ./vnc
    container_name: portolano-dev-vnc
    ports:
      - "127.0.0.1:15900:5900"

  vnc-tls:
    <<: *test-credentials
    build:
      context: ./vnc
      dockerfile: Dockerfile.tls
    container_name: portolano-dev-vnc-tls
    ports:
      - "127.0.0.1:15901:5900"
