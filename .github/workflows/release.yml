name: Release

# Builds the installers, the signed auto-update packages and `latest.json`, and attaches
# them to a DRAFT GitHub Release.
#
# - Push a tag `vX.Y.Z` (it must match the version in the project files, see
#   docs/RELEASING.md): everything is built and a draft release is created for review.
# - Run it by hand (workflow_dispatch) for a dry run: everything is built and kept as
#   workflow artifacts for 14 days, nothing is published and no release is created.
#
# The update packages are signed with the Tauri updater key (secrets TAURI_SIGNING_PRIVATE_KEY
# and TAURI_SIGNING_PRIVATE_KEY_PASSWORD). That key has nothing to do with Apple or Windows
# code signing. The builds fail early without it, dry runs included, because
# `bundle.createUpdaterArtifacts` makes `tauri build` require it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# A release run is never cancelled half way.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Read-only by default. Only the `publish` job below gets `contents: write`.
permissions:
  contents: read

env:
  NODE_VERSION: "26"

defaults:
  run:
    shell: bash

jobs:
  # ---------------------------------------------------------------------------------------
  # 1. Fail early, before spending any runner minutes on the builds, if the tag and the
  #    version numbers in the repository disagree, or if CHANGELOG.md has no release notes
  #    for this version.
  # ---------------------------------------------------------------------------------------
  verify:
    name: Check tag and versions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare the tag with Cargo.toml, tauri.conf.json and both package.json files
        id: check
        env:
          # Empty on a manual (dry-run) start: then only the files are compared with each other.
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: python3 .github/scripts/check-version.py "$TAG"

      # The release notes come from CHANGELOG.md (see docs/RELEASING.md). Extracted here, with
      # read-only access and before any build, so a missing or empty section, or a final
      # version whose date is still "Unreleased", stops the run in the first minute. The
      # version reaches the script as an argument from an env var; the notes are only ever
      # written to a file and read from files, never interpolated into a script.
      - name: Extract the release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: python3 .github/scripts/changelog-notes.py "$VERSION" --out release-notes/RELEASE_NOTES.md

      # A separate artifact: `release-files` is attached to the release as is, the notes are not.
      - name: Upload the release notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes/RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------------------
  # 2. One build per platform. These jobs only need to read the repository.
  # ---------------------------------------------------------------------------------------
  build:
    name: Build ${{ matrix.label }}
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon. Native build on the (arm64) macos-latest runner.
          - label: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg   # `app` is kept so the signature can be inspected after the build
            bundle_dir: dmg
            pattern: "*.dmg"
            out_suffix: macos-aarch64.dmg
            lipo_arch: arm64
            # Update package: Portolano.app.tar.gz (same name on both architectures, so renamed).
            archive_pattern: "*.app.tar.gz"
            archive_suffix: macos-aarch64.app.tar.gz
            sig_dir: macos
            sig_pattern: "*.app.tar.gz.sig"
            sig_suffix: macos-aarch64.app.tar.gz.sig
          # Intel Mac. Cross-compiled on the arm64 runner (Apple's toolchain builds both).
          # Two separate disk images were chosen over one "universal" binary: smaller
          # downloads, and a failure in one architecture does not hide the other.
          - label: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg   # `app` is kept so the signature can be inspected after the build
            bundle_dir: dmg
            pattern: "*.dmg"
            out_suffix: macos-x86_64.dmg
            lipo_arch: x86_64
            # Update package: Portolano.app.tar.gz (same name on both architectures, so renamed).
            archive_pattern: "*.app.tar.gz"
            archive_suffix: macos-x86_64.app.tar.gz
            sig_dir: macos
            sig_pattern: "*.app.tar.gz.sig"
            sig_suffix: macos-x86_64.app.tar.gz.sig
          - label: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            bundle_dir: nsis
            pattern: "*-setup.exe"
            out_suffix: windows-x64-setup.exe
            lipo_arch: ""
            # Tauri v2 reuses the NSIS installer as the update package: only its signature
            # is extra, and `latest.json` points at the installer itself.
            archive_pattern: ""
            archive_suffix: ""
            sig_dir: nsis
            sig_pattern: "*-setup.exe.sig"
            sig_suffix: windows-x64-setup.exe.sig
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the Rust toolchain
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install stable --profile minimal --target "$TARGET" --no-self-update
          rustup default stable
          rustc --version

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          cache: true
          cache_dependency_path: |
            pnpm-lock.yaml
            ui/pnpm-lock.yaml

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # The root install provides the Tauri CLI; the UI has its own lockfile.
      - name: Install JavaScript dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir ui install --frozen-lockfile

      # Optional code signing -------------------------------------------------------------
      # The project has no Apple Developer ID and no Windows certificate, so nothing is
      # signed with a real identity. On macOS, `bundle.macOS.signingIdentity = "-"` in
      # src-tauri/tauri.conf.json gives the app an ad-hoc signature (required for the binary
      # to run on Apple Silicon at all).
      #
      # To sign and notarise later, add the secrets below to the repository and uncomment
      # this step. It is written so that it does nothing when a secret is missing. Do NOT put
      # the secrets directly in the build step's `env:`: Tauri treats an EMPTY
      # APPLE_SIGNING_IDENTITY / APPLE_CERTIFICATE as "set" and would fail the build.
      # Environment variables override the "-" in tauri.conf.json.
      #
      # - name: Enable macOS signing and notarisation (optional)
      #   if: runner.os == 'macOS'
      #   env:
      #     APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}               # base64 of the .p12
      #     APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      #     APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}     # "Developer ID Application: Name (TEAMID)"
      #     APPLE_ID: ${{ secrets.APPLE_ID }}                                 # notarisation
      #     APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}                     # app-specific password
      #     APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      #   run: |
      #     if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_CERTIFICATE_PASSWORD" ] && [ -n "$APPLE_SIGNING_IDENTITY" ]; then
      #       {
      #         echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE"
      #         echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
      #         echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
      #       } >> "$GITHUB_ENV"
      #       if [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
      #         { echo "APPLE_ID=$APPLE_ID"; echo "APPLE_PASSWORD=$APPLE_PASSWORD"; echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"; } >> "$GITHUB_ENV"
      #       fi
      #     else
      #       echo "No Apple signing secrets: building with the ad-hoc signature."
      #     fi
      #
      # Windows: set `bundle.windows.signCommand` (or `certificateThumbprint`) in tauri.conf.json
      # and add the matching secrets in the same conditional way. See docs/RELEASING.md.

      # The updater signing key is exposed to this step only. Never `echo` it or turn on
      # `set -x` here. Tauri reads it from the environment (`.env` files are not used).
      - name: Build the installer and the signed update package
        env:
          TARGET: ${{ matrix.target }}
          BUNDLES: ${{ matrix.bundles }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # Fail with a clear message instead of a cryptic bundler error. The password may be
          # legitimately empty only for a key generated without one, which this project does
          # not use, so both are required.
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ] || [ -z "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]; then
            echo "::error::The repository secrets TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD must both be set (updater signing key, see docs/RELEASING.md)."
            exit 1
          fi
          # `--locked`: the build must use exactly the dependencies in Cargo.lock.
          pnpm exec tauri build --target "$TARGET" --bundles "$BUNDLES" -- --locked

      - name: Verify the macOS bundle (signature, architecture, minimum system)
        if: runner.os == 'macOS'
        env:
          TARGET: ${{ matrix.target }}
          EXPECTED_ARCH: ${{ matrix.lipo_arch }}
        run: |
          app="target/${TARGET}/release/bundle/macos/Portolano.app"
          test -d "$app" || { echo "::error::$app not found"; find "target/${TARGET}/release/bundle" -maxdepth 2; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dvv "$app" 2>&1 | grep -E '^(Identifier|Format|Signature|Authority|TeamIdentifier|CodeDirectory)' || true
          arch="$(lipo -archs "$app/Contents/MacOS/portolano")"
          echo "Architectures: $arch"
          [ "$arch" = "$EXPECTED_ARCH" ] || { echo "::error::expected architecture '$EXPECTED_ARCH', got '$arch'"; exit 1; }
          echo "LSMinimumSystemVersion: $(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$app/Contents/Info.plist")"

      - name: Collect the installer and the update package under clear names
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          TARGET: ${{ matrix.target }}
          BUNDLE_DIR: ${{ matrix.bundle_dir }}
          PATTERN: ${{ matrix.pattern }}
          OUT_SUFFIX: ${{ matrix.out_suffix }}
          ARCHIVE_PATTERN: ${{ matrix.archive_pattern }}
          ARCHIVE_SUFFIX: ${{ matrix.archive_suffix }}
          SIG_DIR: ${{ matrix.sig_dir }}
          SIG_PATTERN: ${{ matrix.sig_pattern }}
          SIG_SUFFIX: ${{ matrix.sig_suffix }}
        run: |
          shopt -s nullglob
          bundle="target/${TARGET}/release/bundle"
          mkdir -p release-files

          # copy_one DIR PATTERN SUFFIX: copy the single file matching PATTERN in DIR as
          # Portolano-<version>-<suffix>. Anything but exactly one match is an error.
          copy_one() {
            local dir="$1" pattern="$2" suffix="$3"
            local files=("${bundle}/${dir}"/$pattern)
            if [ "${#files[@]}" -ne 1 ]; then
              echo "::error::expected exactly one '$pattern' in ${bundle}/${dir}, found ${#files[@]}"
              find "$bundle" -maxdepth 3
              exit 1
            fi
            cp "${files[0]}" "release-files/Portolano-${VERSION}-${suffix}"
          }

          copy_one "$BUNDLE_DIR" "$PATTERN" "$OUT_SUFFIX"
          # macOS only: Portolano.app.tar.gz (the file name is the same on both architectures).
          if [ -n "$ARCHIVE_PATTERN" ]; then
            copy_one macos "$ARCHIVE_PATTERN" "$ARCHIVE_SUFFIX"
          fi
          # The signature of the update package (a one-line text file).
          copy_one "$SIG_DIR" "$SIG_PATTERN" "$SIG_SUFFIX"
          ls -l release-files

      - name: Upload the installer and update package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-${{ matrix.label }}
          path: release-files/*
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------------------
  # 3. Gather the files, write latest.json and compute the SHA-256 checksums (runs on dry
  #    runs too). Read-only like the builds; the script is the only repository code involved,
  #    which is why `publish` below can stay free of any.
  # ---------------------------------------------------------------------------------------
  package:
    name: latest.json and checksums
    needs: [verify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the installers and update packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installer-*
          merge-multiple: true
          path: release-files

      - name: Download the release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: release-notes

      # The updater downloads `latest.json` from the release (see docs/RELEASING.md). The
      # script checks that every expected file and signature is there, and nothing else.
      # The notes in it are the same text as the release body (the app uses them when the
      # GitHub API is not reachable). They are read from the file into a shell variable and
      # passed as one quoted argument; nothing is interpolated into the script.
      - name: Write latest.json
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          notes="$(cat release-notes/RELEASE_NOTES.md)"
          python3 .github/scripts/make-latest-json.py \
            --dir release-files \
            --version "$VERSION" \
            --tag "v${VERSION}" \
            --repo "$REPO" \
            --notes "$notes"
          cat release-files/latest.json

      # Covers every file that will be attached, except the checksum file itself.
      - name: Write SHA256SUMS.txt
        working-directory: release-files
        run: |
          export LC_ALL=C
          files=()
          for f in *; do
            [ "$f" = "SHA256SUMS.txt" ] || files+=("$f")
          done
          [ "${#files[@]}" -gt 0 ] || { echo "::error::no files to checksum"; exit 1; }
          sha256sum -- "${files[@]}" > ../SHA256SUMS.txt
          mv ../SHA256SUMS.txt SHA256SUMS.txt
          cat SHA256SUMS.txt
          ls -l

      - name: Upload the release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: release-files/*
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------------------
  # 4. Create the DRAFT release (tag pushes only). The only job with write access; it runs
  #    no repository code and does not check the repository out.
  # ---------------------------------------------------------------------------------------
  publish:
    name: Create the draft release
    if: github.ref_type == 'tag'
    needs: [verify, package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release-files

      - name: Download the release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: release-notes

      - name: Create (or update) the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          shopt -s nullglob
          files=(release-files/*)
          [ "${#files[@]}" -gt 0 ] || { echo "::error::no release files"; exit 1; }

          if gh release view "$TAG" > /dev/null 2>&1; then
            # A re-run: only replace the files, and only while the release is still a draft.
            is_draft="$(gh release view "$TAG" --json isDraft --jq .isDraft)"
            [ "$is_draft" = "true" ] || { echo "::error::release $TAG is already published; refusing to modify it"; exit 1; }
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            # The release body is shown inside the app (update dialog and "What's new"). It is
            # the CHANGELOG.md section extracted by the `verify` job, plus a short closing
            # paragraph for people who install for the first time. A file, never inline text.
            # (latest.json carries the section alone and is what the app prefers.)
            body="release-notes/BODY.md"
            {
              cat release-notes/RELEASE_NOTES.md
              # The app cuts the text from this marker on (it is invisible on GitHub); keep it
              # identical to INSTALL_NOTE_MARKER in src-tauri/src/update/notes.rs.
              printf '\n<!-- portolano:install-note -->\n\n---\n\n'
              printf 'First install? These builds are not signed, so macOS and Windows warn on first launch: see the Download section of the README. Check the files against `SHA256SUMS.txt`.\n'
            } > "$body"
            flags=(--draft --verify-tag --title "Portolano ${VERSION}" --notes-file "$body")
            [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
            gh release create "$TAG" "${flags[@]}" "${files[@]}"
          fi
