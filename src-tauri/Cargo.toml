[package]
name = "portolano"
description = "Portolano: personal remote-connection manager"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "portolano_lib"
path = "src/lib.rs"

[[bin]]
name = "portolano"
path = "src/main.rs"

[dependencies]
portolano-core-model.workspace = true
portolano-vault.workspace = true
portolano-session-term.workspace = true
portolano-session-rdp.workspace = true
portolano-session-vnc.workspace = true
portolano-importers.workspace = true
tauri.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-updater.workspace = true
tauri-plugin-opener.workspace = true
tokio-rustls.workspace = true
semver.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
secrecy.workspace = true
sha2.workspace = true
arboard.workspace = true
chacha20poly1305.workspace = true
getrandom.workspace = true
zeroize.workspace = true

# The change counter of the macOS pasteboard (readable without any permission prompt) and the
# marker types password managers use for concealed content.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSString", "NSError", "NSAppleEventDescriptor", "NSAppleEventManager"] }
# Touch ID for quick unlock (LAContext; no app signing needed) and the block type of its reply.
objc2-local-authentication = { version = "0.3", default-features = false, features = ["std", "LAContext", "LAError", "block2"] }
block2 = "0.6"

# Core dumps are disabled at start-up (`setrlimit`): a dump would contain the unlocked vault.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The clipboard sequence number of Windows (the same crate `arboard` uses there).
[target.'cfg(windows)'.dependencies]
clipboard-win = "5.3"
# Windows Hello for quick unlock (`UserConsentVerifier`; same `windows` version as Tauri's).
windows = { version = "0.62", features = ["Foundation", "Security_Credentials_UI", "Win32_Foundation", "Win32_System_WinRT"] }
# The async operation type of the WinRT calls (`join` waits for the answer); already in the lock.
windows-future = "0.3"

[build-dependencies]
tauri-build.workspace = true

[lints.cargo]
# The RDP and VNC crates are wired by their work packages (WP6, WP7).
unused_dependencies = "allow"

[dev-dependencies]
tempfile.workspace = true
